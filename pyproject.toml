[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simplesoup"
version = "2026.09.11"
description = "Simple CSS-style yt-dlp and FFmpeg wrapper"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "yt-dlp",
    "requests"
]

[project.optional-dependencies]
gallery = [
    "gallery-dl"
]

[tool.setuptools.packages.find]
include = ["simplesoup*"]
